[project]
name = "zombie-sweeper"
version = "0.1.0"
description = "AWS Resource & Cost Sweeper — find and destroy zombie resources across all regions"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.5",
]

[project.scripts]
zombie-sweeper = "zombie_sweeper.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
